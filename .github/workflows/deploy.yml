name: 🚀 Deploy to visitkashi.in (Hostinger)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger Production
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      # ── 2. SSH into Hostinger and deploy ─────────────────────────
      - name: 🚀 Deploy via SSH to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          script: |
            set -e

            echo "📁 Navigating to project..."
            cd ${{ secrets.PROJECT_PATH }}

            echo "⬇️  Pulling latest code..."
            git pull origin main

            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --quiet

            echo "🧹 Clearing all caches..."
            php artisan optimize:clear

            echo "🔗 Storage symlink..."
            php artisan storage:link 2>/dev/null || true

            echo "🔐 Fixing permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "⚡ Rebuilding config and views..."
            php artisan config:cache
            php artisan view:cache

            echo "📦 Minifying CSS/JS assets..."
            php artisan assets:minify 2>/dev/null || true

            echo "🖼️  Converting images to WebP..."
            php artisan images:webp --quality=82 2>/dev/null || true

            echo "🗑️  Cleaning debugbar storage..."
            rm -rf storage/debugbar/* 2>/dev/null || true

            echo ""
            echo "✅ Deployment to visitkashi.in complete!"
