name: Deploy to visitkashi.in

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. SSH into server and deploy ────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            echo "▶ Pulling latest code..."
            git pull origin main

            echo "▶ Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --quiet

            echo "▶ Clearing all caches..."
            php artisan optimize:clear

            echo "▶ Storage symlink..."
            php artisan storage:link 2>/dev/null || true

            echo "▶ Fixing permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "▶ Rebuilding config and views..."
            php artisan config:cache
            php artisan view:cache

            echo "▶ Minifying assets..."
            php artisan assets:minify 2>/dev/null || true

            echo "▶ Converting images to WebP..."
            php artisan images:webp --quality=82 2>/dev/null || true

            echo "▶ Cleaning debugbar..."
            rm -rf storage/debugbar/* 2>/dev/null || true

            echo "✅ Deployment complete!"
