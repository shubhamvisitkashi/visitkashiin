name: 🚀 Deploy to visitkashi.in (Hostinger)

on:
  push:
    branches:
      - main

# SSH deployment disabled — using Hostinger Git Auto-Deploy instead
# See hPanel → Website → Git for webhook deployment setup
jobs:
  notify:
    name: Deployment via Hostinger Git Auto-Deploy
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Code pushed to main
        run: |
          echo "✅ Code pushed to GitHub main branch"
          echo "🔄 Hostinger Git Auto-Deploy will handle deployment automatically"
          echo "📌 Setup: hPanel → visitkashi.in → Website → Git"
